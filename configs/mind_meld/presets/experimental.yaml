# Experimental Mind Meld Preset
# Maximum blending with all advanced features enabled

models:
  - engine: pytorch
    model: google/gemma-3-1b-it
    weight: 0.5
  - engine: pytorch
    model: google/gemma-2-2b-it
    weight: 0.5

strategy: weighted
interval: 4

prompt: "In the intersection of multiple minds,"

blend:
  enabled: true
  mode: smooth
  strategy: ensemble_voting
  soft_swap: true
  soft_swap_weight: 0.5
  order_neutral: true
  strength: 100

generation:
  steps: 40
  temperature: 0.8
  top_k: 10
  top_p: 0.95
  repetition_penalty: 1.1

output:
  verbose: true
  show_attention: true
  summary_only: false
  meld_diagnostics: true

advanced:
  translate_logits: true
  allow_kv_cache_translation: true
  force_kv_cache_translation: false
  use_sparse_ot: false
  alignment_strategy: semantic
  use_abe: false
  use_stats_tracker: true
  use_enhanced: true

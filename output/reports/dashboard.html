
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Benchmark Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f9f9f9; }
    .container { max-width: 1200px; margin: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h1, h2 { color: #333; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Benchmark Dashboard</h1>
    <div class="grid">
      <div class="card">
        <h2>Performance by Provider</h2>
        <canvas id="providerChart"></canvas>
      </div>
      <div class="card">
        <h2>Performance by Variant</h2>
        <canvas id="variantChart"></canvas>
      </div>
    </div>
  </div>
  <script>
    new Chart(document.getElementById('providerChart'), {
      type: 'bar',
      data: {
        labels: ["ollama-gpt-oss-120b"],
        datasets: [{
          label: 'Mean Score',
          data: [92.16190476190476],
          backgroundColor: 'rgba(54, 162, 235, 0.6)'
        }]
      },
      options: { scales: { y: { beginAtZero: true, max: 100 } } }
    });
    new Chart(document.getElementById('variantChart'), {
      type: 'bar',
      data: {
        labels: ["javascript","typescript"],
        datasets: [{
          label: 'Mean Score',
          data: [91.96190476190478,92.36190476190477],
          backgroundColor: 'rgba(75, 192, 192, 0.6)'
        }]
      },
      options: { scales: { y: { beginAtZero: true, max: 100 } } }
    });
  </script>
</body>
</html>

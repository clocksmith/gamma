[pytest]
testpaths = tests
addopts = -ra
markers =
    docs: docs/runtime CLI parity checks.
    regression: focused regression tests for routing and telemetry behavior.
    native: bounded enwiki9 synthetic native sanitizer fixtures.
    historical: original enwiki9 closure compatibility in a restricted filesystem.
    linux_resource: requires an explicitly provisioned delegated Linux cgroup.
    enwiki9: archived enwiki9 tests under tests/ (set in tests/conftest.py); skipped by a bare run, selected by -m enwiki9, GAMMA_ALL_TESTS=1, or naming the file

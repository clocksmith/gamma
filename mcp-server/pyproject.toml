[project]
name = "gamma-mcp-server"
version = "1.0.0"
description = "Model Context Protocol server for GAMMA LLM experimentation toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
gamma-mcp-server = "gamma_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_backend"

[project]
name = "gamma-core"
version = "0.1.0"
description = "Shared infrastructure for educational ML learning tools"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Gamma Team"}
]
dependencies = [
    "numpy>=1.24.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

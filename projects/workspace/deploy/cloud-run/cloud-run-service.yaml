apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fawn-recipes
  labels:
    app: fawn-recipes
    component: fawn-workspace
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/fawn/fawn-recipes:COMMIT_SHA_REQUIRED
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
            - name: FAWN_RECIPE_DB_PATH
              value: "/data/recipes.sqlite"
            - name: FAWN_CATALOG_QUORUM
              value: "2"
            - name: FAWN_RECIPE_SECRET
              valueFrom:
                secretKeyRef:
                  name: fawn-recipe-secret
                  key: latest
            - name: FAWN_RECIPE_CLIENTS_JSON
              valueFrom:
                secretKeyRef:
                  name: fawn-recipe-clients-json
                  key: latest
          volumeMounts:
            - name: recipe-data
              mountPath: /data
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: recipe-data
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: false
            volumeAttributes:
              bucketName: BUCKET_NAME_REQUIRED

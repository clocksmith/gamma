name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Ruff (blocking)
        run: ruff check --select E9,F63,F7,F82 .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Pytest suite (blocking)
        run: ./run_tests.sh

  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-base.txt
          python -m pip install pytest

      - name: Routing and telemetry regression tests (blocking)
        run: |
          python -m pytest tests/test_command_router.py -m regression
          python -m pytest tests/test_fallback_telemetry.py -m regression

  docs_drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install docs parity deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-base.txt
          python -m pip install pytest

      - name: Docs/runtime parity test (blocking)
        run: python -m pytest tests/test_docs_cli_parity.py -m docs

  smoke_cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-base.txt

      - name: CLI help smoke checks (blocking)
        run: |
          python gamma.py help
          python gamma.py help game
          python gamma.py help comparison
          python gamma.py help mind-meld
          python gamma.py help benchmark
          python gamma.py help codegen

name: CI

on:
  workflow_dispatch:
    inputs:
      enwiki9_groups:
        description: Run the archived enwiki9 project-local test groups
        required: false
        default: false
        type: boolean
      enwiki9_linux_resources:
        description: Run on the separately provisioned enwiki9 cgroup runner
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node_contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            projects/self_transform
            tools/codegen-bench
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserved study tests from a foreign working directory
        run: npm --prefix projects/self_transform test
      - name: Benchmark infrastructure and optional browser dependency
        run: |
          node tools/codegen-bench/tests/benchmark.test.js
          node tools/codegen-bench/index.js --help

  retained_artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /tests/
            /projects/enwiki9/tools/
            /projects/enwiki9/tests/
            /projects/enwiki9/docs/archive-maintenance/
            /projects/enwiki9/operations/adaptive/experiments/
            /projects/enwiki9/operations/evidence/fixtures/
            /projects/enwiki9/results/raw_reverse_bz2250k_q0_v1/artifacts.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retained artifacts stay outside the maintained tree
        run: |
          python tools/retained_artifacts.py check-boundary --catalog projects/enwiki9/docs/archive-maintenance/retained-artifacts.json --root .
          python tools/retained_artifacts.py check-boundary --catalog projects/enwiki9/docs/archive-maintenance/retained-attention-traces.json --root .
          python -m unittest discover -s tests -p test_retained_artifacts.py
          python -m unittest discover -s projects/enwiki9/tests -p test_archive_inventory.py
          python -m unittest discover -s projects/enwiki9/tests -p test_raw_reverse_restore.py
          python -m unittest discover -s projects/enwiki9/tests -p test_attention_trace_restore.py
          python -m unittest discover -s tests -p test_component_map.py

  enwiki9:
    if: github.event_name == 'workflow_dispatch' && inputs.enwiki9_groups
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [pure, codec, native, historical]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Provision fixture dependencies
        run: |
          python -m pip install pytest jsonschema
          sudo apt-get update
          sudo apt-get install -y bubblewrap gcc
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Explicit project-local acceptance group
        run: python projects/enwiki9/tests/run_architecture_groups.py ${{ matrix.group }}

  enwiki9_linux_resources:
    if: github.event_name == 'workflow_dispatch' && inputs.enwiki9_linux_resources
    runs-on: [self-hosted, linux, enwiki9-cgroup]
    steps:
      - uses: actions/checkout@v4
      - name: Require provisioned resource delegation
        run: test -n "$GAMMA_ENWIKI9_TEST_CGROUP_PARENT"
      - name: Owned Linux resource integration
        run: python3 projects/enwiki9/tests/run_architecture_groups.py linux

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      # The archived enwiki9 lane has its own manual test groups above.
      - name: Ruff syntax and undefined names
        run: ruff check .

  # Hosted CI is a smoke test. The full pytest suite (./run_tests.sh tests) and the
  # CATSCAN drift check (python tools/catscan.py --check) run on demand.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/smoke.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/smoke.txt
      - name: CLI help smoke
        run: |
          python gamma.py help
          python gamma.py help game
          python gamma.py help comparison
          python gamma.py help mind-meld
          python gamma.py help benchmark
          python gamma.py help codegen
      - name: Install the toolkit and its independent core
        run: python -m pip install --no-deps ./gamma-core .
      - name: Installed entrypoints and resources outside the checkout
        run: |
          cd "$(mktemp -d)"
          gamma help game
          python -m gamma benchmark --help
          python -c "from gamma.mind_meld.cli.config import PRESETS_DIR; assert len(list(PRESETS_DIR.glob('*.yaml'))) == 6"
      - name: Engine, game, and UI tests
        run: python -m pytest -q tests/test_engine_interface.py tests/test_engine_factory.py tests/test_game.py tests/test_ui_components.py

name: Fetch pinned doocs 3623-4081 sources

on:
  push:
    branches:
      - artifact/leetcode-3623-4081-patch-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone pinned upstream ranges
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/doocs/leetcode.git /tmp/doocs-leetcode
          git -C /tmp/doocs-leetcode sparse-checkout init --cone
          git -C /tmp/doocs-leetcode sparse-checkout set \
            solution/3600-3699 \
            solution/3700-3799 \
            solution/3800-3899 \
            solution/3900-3999 \
            solution/4000-4099
          git -C /tmp/doocs-leetcode checkout f39d6eb98551c8b90713a26a70bf681494803ab9
          test "$(git -C /tmp/doocs-leetcode rev-parse HEAD)" = "f39d6eb98551c8b90713a26a70bf681494803ab9"
          git -C /tmp/doocs-leetcode rev-parse HEAD > /tmp/UPSTREAM_COMMIT
          tar -czf /tmp/doocs-leetcode-3600-4099-f39d6eb.tar.gz \
            -C /tmp/doocs-leetcode \
            solution/3600-3699 solution/3700-3799 solution/3800-3899 \
            solution/3900-3999 solution/4000-4099
          find /tmp/doocs-leetcode/solution/{3600-3699,3700-3799,3800-3899,3900-3999,4000-4099} \
            -maxdepth 2 -type f -printf '%P\n' | sort > /tmp/source-files.txt
          sha256sum /tmp/doocs-leetcode-3600-4099-f39d6eb.tar.gz > /tmp/SHA256SUMS

      - name: Upload pinned source artifact
        uses: actions/upload-artifact@v4
        with:
          name: doocs-leetcode-3600-4099-f39d6eb
          path: |
            /tmp/doocs-leetcode-3600-4099-f39d6eb.tar.gz
            /tmp/source-files.txt
            /tmp/UPSTREAM_COMMIT
            /tmp/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

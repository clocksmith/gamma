name: Prepare LeetCode 3623-4081 paired patch

on:
  push:
    branches:
      - artifact/leetcode-3623-4081-patch-20261026
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-leetcode-3623-4081-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Gamma
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore pinned generator programs
        shell: bash
        env:
          GENERATOR_PY_GZ_B64: 
          GENERATOR_JS_GZ_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          Path('/tmp/generate_leetcode_pairs.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['GENERATOR_PY_GZ_B64'])))
          Path('/tmp/generate_leetcode_javascript.cjs').write_bytes(gzip.decompress(base64.b64decode(os.environ['GENERATOR_JS_GZ_B64'])))
          PY
          python -m py_compile /tmp/generate_leetcode_pairs.py
          node --check /tmp/generate_leetcode_javascript.cjs

      - name: Fetch pinned doocs source ranges
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/doocs/leetcode.git /tmp/doocs-leetcode
          git -C /tmp/doocs-leetcode sparse-checkout init --cone
          git -C /tmp/doocs-leetcode sparse-checkout set \
            solution/3600-3699 \
            solution/3700-3799 \
            solution/3800-3899 \
            solution/3900-3999 \
            solution/4000-4099
          git -C /tmp/doocs-leetcode checkout f39d6eb98551c8b90713a26a70bf681494803ab9
          test "$(git -C /tmp/doocs-leetcode rev-parse HEAD)" = "f39d6eb98551c8b90713a26a70bf681494803ab9"

      - name: Install pinned TypeScript transpiler
        run: npm install --no-save --ignore-scripts typescript@5.9.3

      - name: Generate quarantined paired sources
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/generate_leetcode_pairs.py \
            --repo "$GITHUB_WORKSPACE" \
            --upstream /tmp/doocs-leetcode \
            --node-helper /tmp/generate_leetcode_javascript.cjs

      - name: Verify exact source counts and syntax
        shell: bash
        run: |
          set -euo pipefail
          target="projects/algorithm_solver/catalogue/quarantined/leetcode-3623-4081-paired-v1"
          test "$(find "$target/python" -maxdepth 1 -type f -name '*.py' | wc -l)" -eq 252
          test "$(find "$target/javascript" -maxdepth 1 -type f -name '*.js' | wc -l)" -eq 252
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('projects/algorithm_solver/catalogue/quarantined/leetcode-3623-4081-paired-v1/generation-report.json').read_text())
          assert report['status'] == 'passed', report
          assert report['generated_pair_count'] == 252, report
          assert report['python_syntax_checked'] == 252, report
          assert report['javascript_syntax_checked'] == 252, report
          PY
          find "$target/python" -maxdepth 1 -type f -name '*.py' -print0 | xargs -0 -n 1 python -m py_compile
          find "$target/javascript" -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
          find "$target" -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Build and independently apply-check patch
        shell: bash
        run: |
          set -euo pipefail
          target="projects/algorithm_solver/catalogue/quarantined/leetcode-3623-4081-paired-v1"
          artifacts=/tmp/gamma-leetcode-3623-4081-artifacts
          patch="$artifacts/gamma-leetcode-3623-4081-paired.patch"
          mkdir -p "$artifacts"
          git add -N -- "$target"
          git diff --check -- "$target"
          git diff --no-ext-diff --binary -- "$target" > "$patch"
          test -s "$patch"

          git worktree add --detach /tmp/gamma-patch-check HEAD
          git -C /tmp/gamma-patch-check apply --check "$patch"
          git -C /tmp/gamma-patch-check apply "$patch"
          test "$(find "/tmp/gamma-patch-check/$target/python" -maxdepth 1 -type f -name '*.py' | wc -l)" -eq 252
          test "$(find "/tmp/gamma-patch-check/$target/javascript" -maxdepth 1 -type f -name '*.js' | wc -l)" -eq 252
          find "/tmp/gamma-patch-check/$target/python" -maxdepth 1 -type f -name '*.py' -print0 | xargs -0 -n 1 python -m py_compile
          find "/tmp/gamma-patch-check/$target/javascript" -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

          tar -czf "$artifacts/gamma-leetcode-3623-4081-paired-sources.tar.gz" -C "$GITHUB_WORKSPACE" "$target"
          cp "$target/generation-report.json" "$artifacts/"
          cp "$target/manifest.json" "$artifacts/"
          cp "$target/source-list.csv" "$artifacts/"
          cp "$target/README.md" "$artifacts/"
          (
            cd "$artifacts"
            sha256sum gamma-leetcode-3623-4081-paired.patch \
              gamma-leetcode-3623-4081-paired-sources.tar.gz \
              generation-report.json manifest.json source-list.csv README.md \
              > SHA256SUMS
          )

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamma-leetcode-3623-4081-paired-patch
          path: /tmp/gamma-leetcode-3623-4081-artifacts/
          if-no-files-found: error
          retention-days: 7

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_backend"

[project]
name = "flux-diffusion"
version = "0.1.0"
description = "Interactive diffusion model learning lab"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Flux Team"}
]
dependencies = [
    "gamma-core>=0.1.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "transformers>=4.35.0",
    "torch>=2.1.0",
]

[project.optional-dependencies]
pytorch = [
    "diffusers>=0.25.0",
    "accelerate>=0.25.0",
    "safetensors>=0.4.0",
]
mlx = [
    "mlx>=0.5.0",
    "mlx-stable-diffusion>=0.1.0",
]
all = [
    "diffusers>=0.25.0",
    "accelerate>=0.25.0",
    "safetensors>=0.4.0",
    "mlx>=0.5.0",
    "mlx-stable-diffusion>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
flux = "flux:main"
